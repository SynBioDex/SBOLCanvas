<h1 mat-dialog-title>An issue has occurred.</h1>
<mat-expansion-panel *ngIf="hasDetails; else plainMessage" [expanded]="true" #details>
    <mat-expansion-panel-header>

        <mat-panel-description>
            Click to see {{ details.expanded ? 'less' : 'more' }} details.
        </mat-panel-description>
    </mat-expansion-panel-header>

    <div id="error-content-size"></div>
    <ng-template matExpansionPanelContent>
        <iframe id="error-frame" [srcdoc]="message" (load)="fitFrame($event.target)"></iframe>
    </ng-template>
</mat-expansion-panel>

<ng-template #plainMessage>
    <div mat-dialog-content>
        <p>{{ message }}</p>
    </div>
</ng-template>

<div mat-dialog-actions>
    <!-- <button mat-button (click)="onDownloadGraphClick()">Download Raw Design</button> -->
    <button mat-button (click)="onOkClick()">Ok</button>
</div>
