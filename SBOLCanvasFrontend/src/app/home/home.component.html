<!-- Toolbar -->
<app-toolbar></app-toolbar>

<!-- Workspace: left panel | canvas | right panel -->
<div class="workspace">

  <!-- LEFT: glyph palette -->
  <app-side-panel
    #leftPanel="sidePanel"
    side="left"
    panelName="GLYPHS"
    [showSearch]="true"
    [initialCollapsed]="false"
    (searchPhraseChange)="glyphSearch = $event"
  >
    <ng-container *ngFor="let s of glyphSections">
      <app-collapsible-section
        *ngIf="s.alwaysShown || !palette.componentDefinitionMode"
        [title]="s.title"
        [searchMatch]="glyphSearch ? sectionHasMatch(s) : null"
      >
        <app-glyph-grid
          [glyphs]="s.glyphs"
          [elementType]="s.elementType"
          [searchPhrase]="glyphSearch"
          (glyphClicked)="s.add($event)"
        ></app-glyph-grid>
      </app-collapsible-section>
    </ng-container>

    <app-collapsible-section title="Util" [searchMatch]="glyphSearch ? palette.utilHasMatch(glyphSearch) : null">
      <app-util-glyph-grid [searchPhrase]="glyphSearch"></app-util-glyph-grid>
    </app-collapsible-section>
  </app-side-panel>

  <!-- CENTER: canvas. The panel widths are published as CSS vars so the floating canvas widgets
       (zoom controls, problems, hierarchy preview) sit beside the panels and track them. -->
  <div
    class="canvas-area"
    [style.--left-panel-w]="leftPanel.outerWidth + 'px'"
    [style.--right-panel-w]="rightPanel.outerWidth + 'px'"
  >
    <app-canvas></app-canvas>
    <app-problems></app-problems>
    <app-hierarchy-preview></app-hierarchy-preview>
    <app-zoom-controls></app-zoom-controls>
  </div>

  <!-- RIGHT: inspector -->
  <app-side-panel #rightPanel="sidePanel" side="right" panelName="INSPECTOR" [showSearch]="false">
    <app-collapsible-section title="Info">
      <app-info-editor></app-info-editor>
    </app-collapsible-section>
    <app-collapsible-section title="Model" [initialCollapsed]="true">
      <app-model-editor></app-model-editor>
    </app-collapsible-section>
    <app-collapsible-section title="Design" [initialCollapsed]="true">
      <app-color-palette></app-color-palette>
    </app-collapsible-section>
  </app-side-panel>

</div>
