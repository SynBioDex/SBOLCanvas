<div *ngIf="metadataService.hasLoadError" class="config-error">
  Could not load data from the backend.
</div>
<div class="model-menu-container" *ngIf="metadataService.simulationConfig && metadataService.interactionRules && (glyphInfo || interactionInfo || eventInfo)">
  <ng-container *ngIf="interactionInfo">
    <ng-container *ngIf="metadataService.interactionRules[interactionInfo.interactionType] as rule">
      <ng-container *ngFor="let side of graphService.selectedParticipantSides(interactionInfo)">
        <div class="model-section" *ngIf="rule.massAction && !isModifierRole(side)">
          <h4>{{side === 'source' ? 'Source' : 'Target'}} participation</h4>
          <mat-form-field floatLabel="always" *ngFor="let field of metadataService.simulationConfig.participation">
            <mat-label>{{field.label}}</mat-label>
            <input matInput type="number" step="any" [min]="field.min" [value]="coefficientValue(side)"
              [attr.aria-invalid]="!!validationErrors[side + ':' + field.key]"
              [attr.aria-describedby]="side + '-' + field.key + '-error'"
              (change)="coefficientChange(side, field, $event.target.validity.badInput ? $event.target.valueAsNumber : ($event.target.value === '' ? undefined : $event.target.value))">
            <div class="param-error" [id]="side + '-' + field.key + '-error'" role="alert" *ngIf="validationErrors[side + ':' + field.key]">{{validationErrors[side + ':' + field.key]}}</div>
          </mat-form-field>
        </div>
      </ng-container>
    </ng-container>
  </ng-container>

  <div class="model-section">
    <ng-container *ngFor="let field of fields()" [ngSwitch]="field.type">
      <mat-form-field floatLabel="always" *ngSwitchCase="'number'">
        <mat-label>{{field.label}}</mat-label>
        <input matInput type="number" step="any" [id]="field.key" [min]="field.min" [value]="fieldValue(field)"
          [attr.aria-invalid]="!!validationErrors[field.key]" [attr.aria-describedby]="field.key + '-error'"
          (change)="fieldChange(field, $event.target.validity.badInput ? $event.target.valueAsNumber : ($event.target.value === '' ? undefined : $event.target.value))">
        <div class="param-error" [id]="field.key + '-error'" role="alert" *ngIf="validationErrors[field.key]">{{validationErrors[field.key]}}</div>
      </mat-form-field>
      <mat-checkbox *ngSwitchCase="'boolean'" [id]="field.key" [checked]="fieldValue(field)"
        (change)="fieldChange(field, $event.checked)">{{field.label}}</mat-checkbox>
      <mat-form-field floatLabel="always" *ngSwitchCase="'uri'">
        <mat-label>{{field.label}}</mat-label>
        <mat-select [id]="field.key" [value]="fieldValue(field)" (selectionChange)="fieldChange(field, $event.value)">
          <mat-option [value]="undefined">None</mat-option>
          <mat-option *ngFor="let option of targetSpeciesOptions()" [value]="option.value">{{option.label}}</mat-option>
        </mat-select>
        <div class="param-error" role="alert" *ngIf="validationErrors[field.key]">{{validationErrors[field.key]}}</div>
      </mat-form-field>
    </ng-container>
    </div>
  </div>
