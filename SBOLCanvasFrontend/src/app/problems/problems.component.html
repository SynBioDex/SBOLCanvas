<button mat-button
    [matTooltip]="tooltip"
    [matMenuTriggerFor]="problemsMenu" id="problems-expand" aria-label="Warning/problems list"
    [disabled]="!warningCount && !errorCount">
    <div *ngIf="warningCount || errorCount; then problemsBlock else noProblemsBlock"></div>
    <ng-template #problemsBlock>
        <span class="problem-qty warning">{{warningCount || ' '}}

            <mat-icon style="vertical-align: -6px;" [ngClass]="{
                'problem-icon': true,
                'warning': warningCount > 0
            }">warning</mat-icon>
            <span class="problem-qty error">{{errorCount || ' '}}</span>
            <mat-icon style="vertical-align: -6px;" [ngClass]="{
                'problem-icon': true,
                'error': errorCount > 0
            }">error</mat-icon>

        </span>
        
        
    </ng-template>
    <ng-template #noProblemsBlock>
        <mat-icon class="success">check_circle</mat-icon>
    </ng-template>
</button>
<mat-menu #problemsMenu="matMenu" xPosition="before" panelClass="true" class="problems-panel">
    <div *ngIf="emptyView">
        <button mat-menu-item class="problem-item warning">
            <mat-icon class="warning">warning</mat-icon>
            <span>{{emptyViewLabel}}: no children.</span>
        </button>
    </div>
    <ng-container *ngFor="let group of groups">
        <div class="problem-group-label">{{group.label}}</div>
        <div *ngFor="let finding of group.errors">
        <button mat-menu-item class="problem-item error">
            <mat-icon class="error">error</mat-icon>
                <span>{{finding.message}}</span>
        </button>
    </div>
        <div *ngFor="let finding of group.warnings">
        <button mat-menu-item class="problem-item warning">
            <mat-icon class="warning">warning</mat-icon>
                <span>{{finding.message}}</span>
        </button>
    </div>
    </ng-container>
</mat-menu>
